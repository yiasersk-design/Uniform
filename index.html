<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Police Uniform Series | Mobile Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ব্যাকগ্রাউন্ড ন্যানো পার্টিকেল ক্যানভাস */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* মোবাইল কন্টেইনার */
        .mobile-container {
            position: relative;
            z-index: 2;
            width: 100vw;
            max-width: 440px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 12px 28px;
        }

        /* ক্লিন হেডার */
        .header {
            text-align: center;
            margin-top: 6px;
        }

        .header h1 {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* 3D ক্যারোসেল কনটেইনার */
        .carousel-stage {
            position: relative;
            width: 100%;
            height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1100px;
            overflow: visible;
        }

        .carousel-track {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 9:16 সাইজের কার্ড */
        .slide-card {
            position: absolute;
            height: 100%;
            aspect-ratio: 9 / 16;
            border-radius: 6px; /* শার্প ও পরিমিত এজ */
            overflow: hidden;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        opacity 0.5s ease, 
                        filter 0.5s ease,
                        border-color 0.4s ease;
            cursor: pointer;
            will-change: transform, opacity;
        }

        .slide-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ট্যাকটিক্যাল কর্নার মার্কার */
        .corner-bracket {
            position: absolute;
            width: 9px;
            height: 9px;
            border: 2px solid #38bdf8;
            z-index: 5;
            pointer-events: none;
            opacity: 0.8;
        }
        .cb-tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .cb-tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
        .cb-bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
        .cb-br { bottom: 6px; right: 6px; border-left: none; border-top: none; }

        /* কার্ডের 3D পজিশনিং ও পার্শ্ববর্তী অ্যানিমেশন */
        .slide-card.active {
            z-index: 10;
            opacity: 1;
            transform: translateX(0) scale(1) translateZ(0);
            border-color: rgba(56, 189, 248, 0.65);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.35), 0 20px 40px rgba(0, 0, 0, 0.95);
            filter: brightness(1.05);
        }

        .slide-card.prev {
            z-index: 5;
            opacity: 0.55;
            transform: translateX(-56%) scale(0.82) rotateY(25deg);
            filter: brightness(0.6) blur(0.5px);
        }

        .slide-card.next {
            z-index: 5;
            opacity: 0.55;
            transform: translateX(56%) scale(0.82) rotateY(-25deg);
            filter: brightness(0.6) blur(0.5px);
        }

        .slide-card.hidden-left {
            z-index: 1;
            opacity: 0;
            transform: translateX(-100%) scale(0.65) rotateY(40deg);
            pointer-events: none;
        }

        .slide-card.hidden-right {
            z-index: 1;
            opacity: 0;
            transform: translateX(100%) scale(0.65) rotateY(-40deg);
            pointer-events: none;
        }

        /* তথ্য বক্স */
        .info-panel {
            width: 92%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 5px;
            padding: 11px 15px;
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .info-content h2 {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-content p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .flag-tag {
            font-size: 10px;
            font-family: monospace;
            padding: 4px 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 3px;
            color: #38bdf8;
            white-space: nowrap;
        }

        /* নিচের কন্ট্রোল বার */
        .bottom-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .dots-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .dot.active {
            width: 20px;
            background: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        .swipe-guide {
            font-size: 11px;
            font-family: monospace;
            color: #64748b;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- ন্যানো পার্টিকেল ব্যাকগ্রাউন্ড -->
    <canvas id="particleCanvas"></canvas>

    <div class="mobile-container">
        
        <!-- পরিচ্ছন্ন হেডার -->
        <div class="header">
            <h1>GLOBAL POLICE SERIES</h1>
        </div>

        <!-- ৩ডি ক্যারোসেল (৭টি দেশ) -->
        <div class="carousel-stage" id="stage">
            <div class="carousel-track" id="track">

                <!-- ১. ভারত (a.webp) -->
                <div class="slide-card active" 
                     data-country="INDIA" 
                     data-flag="🇮🇳" 
                     data-force="Indian State Police / IPS" 
                     data-sub="Traditional Regulation Khaki Service Uniform">
                    <div class="corner-bracket cb-tl"></div><div class="corner-bracket cb-tr"></div>
                    <div class="corner-bracket cb-bl"></div><div class="corner-bracket cb-br"></div>
                    <img src="https://cdn.jsdelivr.net/gh/yiasersk-design/Uniform@main/Assets/a.webp" alt="India Police">
                </div>

                <!-- ২. ইসরায়েল (b.webp) -->
                <div class="slide-card next" 
                     data-country="ISRAEL" 
                     data-flag="🇮🇱" 
                     data-force="Israel Police (משטרת ישראל)" 
                     data-sub="Midnight Navy-Blue Operational Patrol Uniform">
                    <div class="corner-bracket cb-tl"></div><div class="corner-bracket cb-tr"></div>
                    <div class="corner-bracket cb-bl"></div><div class="corner-bracket cb-br"></div>
                    <img src="https://cdn.jsdelivr.net/gh/yiasersk-design/Uniform@main/Assets/b.webp" alt="Israel Police">
                </div>

                <!-- ৩. যুক্তরাষ্ট্র (c.webp) -->
                <div class="slide-card hidden-right" 
                     data-country="UNITED STATES" 
                     data-flag="🇺🇸" 
                     data-force="NYPD Police Officer" 
                     data-sub="Standard Patrol Navy Uniform & Eight-Point Cap">
                    <div class="corner-bracket cb-tl"></div><div class="corner-bracket cb-tr"></div>
                    <div class="corner-bracket cb-bl"></div><div class="corner-bracket cb-br"></div>
                    <img src="https://cdn.jsdelivr.net/gh/yiasersk-design/Uniform@main/Assets/c.webp" alt="US NYPD Police">
                </div>

                <!-- ৪. রাশিয়া (d.webp) -->
                <div class="slide-card hidden-right" 
                     data-country="RUSSIA" 
                     data-flag="🇷🇺" 
                     data-force="Russian МВД Police (Полиция)" 
                     data-sub="Modern Ministry of Internal Affairs Service Uniform">
                    <div class="corner-bracket cb-tl"></div><div class="corner-bracket cb-tr"></div>
                    <div class="corner-bracket cb-bl"></div><div class="corner-bracket cb-br"></div>
                    <img src="https://cdn.jsdelivr.net/gh/yiasersk-design/Uniform@main/Assets/d.webp" alt="Russian Police">
                </div>

                <!-- ৫. যুক্তরাজ্য (e.webp) -->
                <div class="slide-card hidden-right" 
                     data-country="UNITED KINGDOM" 
                     data-flag="🇬🇧" 
                     data-force="British Police Constable" 
                     data-sub="Traditional Custodian Helmet & Sillitoe Tartan">
                    <div class="corner-bracket cb-tl"></div><div class="corner-bracket cb-tr"></div>
                    <div class="corner-bracket cb-bl"></div><div class="corner-bracket cb-br"></div>
                    <img src="https://cdn.jsdelivr.net/gh/yiasersk-design/Uniform@main/Assets/e.webp" alt="UK British Police">
                </div>

                <!-- ৬. ফ্রান্স (f.webp) -->
                <div class="slide-card hidden-right" 
                     data-country="FRANCE" 
                     data-flag="🇫🇷" 
                     data-force="Police Nationale" 
                     data-sub="Operational Navy Apparel with Official Chest Marking">
                    <div class="corner-bracket cb-tl"></div><div class="corner-bracket cb-tr"></div>
                    <div class="corner-bracket cb-bl"></div><div class="corner-bracket cb-br"></div>
                    <img src="https://cdn.jsdelivr.net/gh/yiasersk-design/Uniform@main/Assets/f.webp" alt="France Police">
                </div>

                <!-- ৭. জাপান (g.webp) -->
                <div class="slide-card hidden-left" 
                     data-country="JAPAN" 
                     data-flag="🇯🇵" 
                     data-force="Japanese Prefectural Police" 
                     data-sub="Blue-Grey Tailored Service Uniform & Peaked Visor">
                    <div class="corner-bracket cb-tl"></div><div class="corner-bracket cb-tr"></div>
                    <div class="corner-bracket cb-bl"></div><div class="corner-bracket cb-br"></div>
                    <img src="https://cdn.jsdelivr.net/gh/yiasersk-design/Uniform@main/Assets/g.webp" alt="Japan Police">
                </div>

            </div>
        </div>

        <!-- ডাইনামিক ইনফরমেশন বার -->
        <div class="info-panel">
            <div class="info-content">
                <h2 id="countryTitle">🇮🇳 INDIA</h2>
                <p id="forceName">Indian State Police / IPS</p>
            </div>
            <div class="flag-tag" id="seriesCounter">SERIES 01 / 07</div>
        </div>

        <!-- ইন্ডিকেটর ও সোয়াইপ দিকনির্দেশনা -->
        <div class="bottom-bar">
            <div class="dots-row" id="dotsContainer">
                <div class="dot active" onclick="jumpToSlide(0)"></div>
                <div class="dot" onclick="jumpToSlide(1)"></div>
                <div class="dot" onclick="jumpToSlide(2)"></div>
                <div class="dot" onclick="jumpToSlide(3)"></div>
                <div class="dot" onclick="jumpToSlide(4)"></div>
                <div class="dot" onclick="jumpToSlide(5)"></div>
                <div class="dot" onclick="jumpToSlide(6)"></div>
            </div>
            <div class="swipe-guide">◀ সোয়াইপ করে অন্য দেশ দেখুন ▶</div>
        </div>

    </div>

    <script>
        /* ১. ন্যানো পার্টিকেল অ্যানিমেশন */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.6 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(window.innerWidth / 7, 50);
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }
        initParticles();

        function connectParticles() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let d = Math.hypot(particles[a].x - particles[b].x, particles[a].y - particles[b].y);
                    if (d < 85) {
                        ctx.strokeStyle = `rgba(56, 189, 248, ${0.12 - d / 85 * 0.12})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            connectParticles();
            requestAnimationFrame(animate);
        }
        animate();

        /* ২. 3D কভারফ্লো ও সোয়াইপ কন্ট্রোল */
        const cards = Array.from(document.querySelectorAll('.slide-card'));
        const dots = Array.from(document.querySelectorAll('.dot'));
        const countryTitle = document.getElementById('countryTitle');
        const forceName = document.getElementById('forceName');
        const seriesCounter = document.getElementById('seriesCounter');
        let currentIndex = 0;

        function updateGallery() {
            const total = cards.length;

            cards.forEach((card, idx) => {
                card.className = 'slide-card';
                let offset = (idx - currentIndex + total) % total;

                if (offset === 0) {
                    card.classList.add('active');
                } else if (offset === 1) {
                    card.classList.add('next');
                } else if (offset === total - 1) {
                    card.classList.add('prev');
                } else if (offset > 1 && offset <= total / 2) {
                    card.classList.add('hidden-right');
                } else {
                    card.classList.add('hidden-left');
                }
            });

            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentIndex);
            });

            // ইনফরমেশন প্যানেল আপডেট
            const activeCard = cards[currentIndex];
            countryTitle.innerHTML = `${activeCard.dataset.flag} ${activeCard.dataset.country}`;
            forceName.innerText = activeCard.dataset.force;
            seriesCounter.innerText = `SERIES 0${currentIndex + 1} / 0${total}`;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % cards.length;
            updateGallery();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            updateGallery();
        }

        function jumpToSlide(index) {
            currentIndex = index;
            updateGallery();
        }

        // কার্ডে ট্যাপ করে নেভিগেশন
        cards.forEach((card, idx) => {
            card.addEventListener('click', () => {
                if (idx !== currentIndex) jumpToSlide(idx);
            });
        });

        // মোবাইল টাচ সোয়াইপ
        let startX = 0, currentX = 0, isSwiping = false;
        const stage = document.getElementById('stage');

        stage.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            isSwiping = true;
        }, { passive: true });

        stage.addEventListener('touchmove', e => {
            if (!isSwiping) return;
            currentX = e.touches[0].clientX;
        }, { passive: true });

        stage.addEventListener('touchend', () => {
            if (!isSwiping) return;
            let diff = startX - currentX;
            if (Math.abs(diff) > 40 && currentX !== 0) {
                if (diff > 0) nextSlide();
                else prevSlide();
            }
            isSwiping = false;
            currentX = 0;
        });

        // অটো স্লাইড (প্রতি ৬ সেকেন্ডে)
        let autoPlay = setInterval(nextSlide, 6000);
        stage.addEventListener('touchstart', () => clearInterval(autoPlay));
        stage.addEventListener('touchend', () => {
            clearInterval(autoPlay);
            autoPlay = setInterval(nextSlide, 6000);
        });

        updateGallery();
    </script>
</body>
</html>
